<svg xmlns="http://www.w3.org/2000/svg" viewBox="30 30 132 132">
  <!-- The wax seal on a closed sheet's envelope (.envelope__seal in style.css):
       the game's color, pressed with the app icon's quill (scripts/icon.html);
       tests/seal.test.js keeps the two quills equal -->
  <defs>
    <radialGradient id="wax" cx=".4" cy=".35" r=".7">
      <stop offset="0" stop-color="#3f8f6e"/>
      <stop offset=".55" stop-color="#1d4f3a"/>
      <stop offset="1" stop-color="#123426"/>
    </radialGradient>
    <!-- The notches of the quill's vane are cut out of it: on the wax's
         gradient a shape painted over them would show past the vane -->
    <mask id="notches" maskUnits="userSpaceOnUse" x="-40" y="-130" width="80" height="140">
      <rect x="-40" y="-130" width="80" height="140" fill="#fff"/>
      <g fill="#000">
