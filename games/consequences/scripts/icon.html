<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>App icon (source)</title>
<!-- The source of the app's icons: `npm run icons` (the kit's command) takes every size
     from it (public/icons/*.png, public/favicon.ico). It lies outside public/,
     so the site never serves it. The drawing is the game's sheet folded like an
     accordion: four pleats of answers folded away and the last panel still open,
     with a line of writing in the game's color (--accent in style.css) - the
     colors of the sheet on the page (.fold, .sheet). Every corner stays inside the
     circle Android cuts a maskable icon to (40% of the size from the center).
     The icon is the game's brand: not covered by the MIT License (README, License) -->
<style>
  html, body { margin: 0; background: transparent; }
  svg { display: block; width: 100vw; height: 100vh; }
</style>
</head>
<body>
  <svg viewBox="0 0 192 192" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <linearGradient id="down" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fbf5e6"/><stop offset="1" stop-color="#d6c296"/></linearGradient>
      <linearGradient id="up" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#cbb586"/><stop offset="1" stop-color="#f3e8cd"/></linearGradient>
    </defs>
    <rect width="192" height="192" fill="#f4e8cc"/>
    <g stroke="#2a1d17" stroke-width="3" stroke-linejoin="round">
      <polygon points="50,40 142,40 150,60 42,60" fill="url(#down)"/>
      <polygon points="42,60 150,60 142,80 50,80" fill="url(#up)"/>
      <polygon points="50,80 142,80 150,100 42,100" fill="url(#down)"/>
      <polygon points="42,100 150,100 142,120 50,120" fill="url(#up)"/>
      <polygon points="50,120 142,120 142,154 50,154" fill="#fbf5e6"/>
    </g>
    <path d="M60 136 q6 -7 12 0 t12 0 t12 0 t12 0 t12 0" fill="none" stroke="#1d4f3a" stroke-width="4" stroke-linecap="round"/>
  </svg>
</body>
</html>
